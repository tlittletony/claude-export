<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>

<title>Isaias at Romar Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one calm reading column, phone-first. Summary first (alert, three numbers, distance bars), detail below. */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --ink: #12232e;
  --muted: #536571;
  --line: #d6dee3;
  --accent: #0f5e78;        /* Gulf water */
  --bar: #7fb3c4;
  --bar-key: #0f5e78;
  /* NHC map colors for watches and warnings */
  --hu-warning: #d7263d;
  --hu-watch: #e86fa8;
  --ts-warning: #2d6cdf;
  --ts-watch: #e3b505;
  --ok: #2f8f5b;
  --chip-ink: #ffffff;
  /* map */
  --water: #cfe1e9;
  --land: #e6eae3;
  --border: #aab5ad;
  --cone: #ffffff;
  --cone-edge: #4f6470;
  --track: #12232e;
  --past: #7d8c95;
  --condo: #0f5e78;
  --cone-opacity: .55;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171d; --surface: #14222a; --ink: #e4ecf0; --muted: #9db0bb; --line: #26363f;
    --accent: #5fb7d4; --bar: #2f6476; --bar-key: #5fb7d4;
    --hu-warning: #ef4f63; --hu-watch: #f08cbc; --ts-warning: #5b8ff0; --ts-watch: #f0c93a; --ok: #4fbf82;
    --chip-ink: #0d171d; color-scheme: dark;
    --water: #10252f; --land: #22313a; --border: #4a5c66; --cone: #b9cbd4; --cone-edge: #a9bec8;
    --track: #e4ecf0; --past: #7f939e; --condo: #5fb7d4; --cone-opacity: .28;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171d; --surface: #14222a; --ink: #e4ecf0; --muted: #9db0bb; --line: #26363f;
  --accent: #5fb7d4; --bar: #2f6476; --bar-key: #5fb7d4;
  --hu-warning: #ef4f63; --hu-watch: #f08cbc; --ts-warning: #5b8ff0; --ts-watch: #f0c93a; --ok: #4fbf82;
  --chip-ink: #0d171d; color-scheme: dark;
  --water: #10252f; --land: #22313a; --border: #4a5c66; --cone: #b9cbd4; --cone-edge: #a9bec8;
  --track: #e4ecf0; --past: #7f939e; --condo: #5fb7d4; --cone-opacity: .28;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 24px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
/* Header is kept small and tight on purpose (Tony's request, Oct 9 2026). Don't enlarge it. */
h1 { font-size: clamp(19px, 4.8vw, 24px); line-height: 1.22; font-weight: 600; text-wrap: pretty; }
h2 { font-size: 22px; font-weight: 600; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-size: 12px; }
.head { display: grid; gap: 8px; }
.summary { font-size: 15px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .01em; line-height: 1.3; padding: 2px 8px; border-radius: 4px; color: var(--chip-ink); background: var(--muted); }
.chip.hu-warning { background: var(--hu-warning); }
.chip.hu-watch { background: var(--hu-watch); }
.chip.ts-warning { background: var(--ts-warning); }
.chip.ts-watch { background: var(--ts-watch); }
.chip.ok { background: var(--ok); }
.updated { color: var(--muted); font-size: 13px; line-height: 1.4; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--surface); padding: 14px 14px 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 6vw, 36px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr; } .stat { grid-template-columns: 1fr auto; align-items: baseline; } .stat .n { grid-column: 1 / -1; } }
section { display: grid; gap: 12px; }
.lede { color: var(--muted); font-size: 14px; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.bar-row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-row.key .t { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 24px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.fill { height: 14px; border-radius: 2px; background: var(--bar); flex: none; min-width: 3px; }
.bar-row.key .fill { background: var(--bar-key); }
.val { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
.facts { margin: 0; display: grid; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fact dt { font-weight: 600; font-size: 15px; }
.fact dd { margin: 0; min-width: 0; }
.fact.bad dt::before, .fact.warn dt::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 2px; }
.fact.bad dt::before { background: var(--hu-warning); }
.fact.warn dt::before { background: var(--ts-watch); }
@media (max-width: 520px) { .fact { grid-template-columns: 1fr; gap: 2px; } }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.timeline li { position: relative; padding: 0 0 14px 18px; display: grid; gap: 1px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--muted); }
.timeline li.key::before { background: var(--hu-warning); border-color: var(--hu-warning); }
.timeline .when { font-family: var(--display); font-weight: 600; font-size: 16px; }
.timeline li.key .when { color: var(--hu-warning); }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; }
.history { margin: 0; display: grid; gap: 8px; }
.history div { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 12px; font-size: 15px; }
.history dt { color: var(--muted); font-variant-numeric: tabular-nums; }
.history dd { margin: 0; }
@media (max-width: 520px) { .history div { grid-template-columns: 1fr; gap: 0; } }
.maps { display: grid; gap: 20px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
figure svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--water); }
figcaption { font-size: 14px; color: var(--muted); }
figcaption strong { color: var(--ink); font-weight: 600; }
@media (min-width: 720px) { .maps { grid-template-columns: 1fr 1fr; } }
.m-water { fill: var(--water); }
.m-land { fill: var(--land); stroke: var(--border); stroke-width: .8; }
.m-border { fill: none; stroke: var(--border); stroke-width: .8; stroke-dasharray: 3 3; }
.m-cone { opacity: var(--cone-opacity); }
.m-cone .edge { fill: none; stroke: var(--cone-edge); stroke-width: 5; }
.m-cone .fill { fill: var(--cone); }
.m-past { fill: none; stroke: var(--past); stroke-width: 2.5; stroke-dasharray: 6 5; }
.m-track { fill: none; stroke: var(--track); stroke-width: 2.5; }
.m-pt circle { fill: var(--track); stroke: var(--water); stroke-width: 2; }
.m-pt text { fill: var(--water); font: 700 13px var(--display); text-anchor: middle; dominant-baseline: central; }
.m-when { fill: var(--track); font: 600 15px var(--display); paint-order: stroke; stroke: var(--water); stroke-width: 4px; stroke-linejoin: round; }
.m-place { fill: var(--muted); font: 500 14px var(--body); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.m-place-dot { fill: var(--muted); }
.m-condo circle { fill: var(--condo); stroke: var(--water); stroke-width: 2.5; }
.m-condo text { fill: var(--condo); font: 700 16px var(--display); paint-order: stroke; stroke: var(--water); stroke-width: 4px; stroke-linejoin: round; }
.m-wind { fill: none; stroke: var(--hu-warning); stroke-width: 2; stroke-dasharray: 5 4; }
.m-wind-label { fill: var(--hu-warning); font: 600 14px var(--display); paint-order: stroke; stroke: var(--water); stroke-width: 4px; stroke-linejoin: round; }
.m-landfall { fill: var(--hu-warning); stroke: var(--water); stroke-width: 2; }
.m-dist { stroke: var(--condo); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend b { font-family: var(--display); color: var(--ink); }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 16px; }
.sources { margin: 0; padding-left: 1.2em; font-size: 14px; }
</style>

<main class="wrap" id="app">
  <p class="updated">Loading the latest storm update…</p>
</main>

<script>
(function () {
  var app = document.getElementById('app');
  var d;
  try { d = JSON.parse(document.getElementById('storm-data').textContent); }
  catch (e) { app.innerHTML = '<p>This update could not be displayed. Check nhc.noaa.gov for the official forecast.</p>'; return; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function section(title, lede) {
    var s = el('section');
    s.appendChild(el('h2', null, title));
    if (lede) s.appendChild(el('p', 'lede', lede));
    app.appendChild(s);
    return s;
  }
  app.textContent = '';

  // Header
  var head = el('header', 'head');
  head.appendChild(el('p', 'eyebrow', 'Storm ' + d.storm + ' · Romar Place #1102, Orange Beach'));
  var chips = el('div', 'chips');
  (d.chips || []).forEach(function (c) { chips.appendChild(el('span', 'chip ' + (c.level || ''), c.label)); });
  head.appendChild(chips);
  head.appendChild(el('h1', null, d.headline));
  if (d.summary) head.appendChild(el('p', 'summary', d.summary));
  head.appendChild(el('p', 'updated', 'Updated ' + d.updated + ' from ' + d.advisory + '. Next forecast: ' + d.next_advisory + '.'));
  app.appendChild(head);

  // Three numbers
  var stats = el('div', 'stats');
  (d.stats || []).forEach(function (s) {
    var b = el('div', 'stat');
    b.appendChild(el('span', 'k', s.label));
    b.appendChild(el('span', 'v', s.value));
    b.appendChild(el('span', 'n', s.note));
    stats.appendChild(b);
  });
  app.appendChild(stats);

  // Maps: forecast cone and path, drawn from NHC forecast points on a fixed base map
  var base = null;
  try { base = JSON.parse(document.getElementById('base-map').textContent); } catch (e) {}
  if (base && d.map && d.map.track && d.map.track.length) {
    var NS = 'http://www.w3.org/2000/svg';
    var sv = function (tag, attrs, parent, text) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text != null) n.textContent = text;
      if (parent) parent.appendChild(n);
      return n;
    };
    var drawMap = function (v, opts) {
      var P = function (lat, lon) { return [(lon - v.lon0) * v.cos * v.S, (v.lat1 - lat) * v.S]; };
      var nmPx = function (nm) { return nm / 60 * v.S; };
      var svg = sv('svg', { viewBox: '0 0 ' + v.W + ' ' + v.H, role: 'img', 'aria-label': opts.aria });
      var clipId = 'clip-' + opts.id;
      var defs = sv('defs', {}, svg);
      var cp = sv('clipPath', { id: clipId }, defs);
      sv('rect', { x: 0, y: 0, width: v.W, height: v.H }, cp);
      var g = sv('g', { 'clip-path': 'url(#' + clipId + ')' }, svg);
      sv('rect', { x: 0, y: 0, width: v.W, height: v.H, 'class': 'm-water' }, g);
      sv('path', { d: v.land, 'class': 'm-land' }, g);
      sv('path', { d: v.borders, 'class': 'm-border' }, g);
      // Cone: union of circles along the track (outline-then-fill draws only the outer edge)
      var T = d.map.track, circles = [];
      for (var i = 0; i < T.length - 1; i++) {
        var a = T[i], b = T[i + 1], steps = 30;
        for (var s = 0; s <= steps; s++) {
          var f = s / steps;
          circles.push([a.lat + (b.lat - a.lat) * f, a.lon + (b.lon - a.lon) * f, (a.cone || 0) + ((b.cone || 0) - (a.cone || 0)) * f]);
        }
      }
      var cone = sv('g', { 'class': 'm-cone' }, opts.local ? null : g);
      var ce = sv('g', { 'class': 'edge' }, cone), cf = sv('g', { 'class': 'fill' }, cone);
      circles.forEach(function (c) {
        var p = P(c[0], c[1]), r = Math.max(nmPx(c[2]), 1);
        sv('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: r.toFixed(1) }, ce);
        sv('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: r.toFixed(1) }, cf);
      });
      // Places
      (v.places || []).forEach(function (pl) {
        var p = P(pl.lat, pl.lon);
        sv('circle', { cx: p[0], cy: p[1], r: 2.5, 'class': 'm-place-dot' }, g);
        sv('text', { x: p[0] + (pl.dx || 6), y: p[1] + (pl.dy || 4), 'class': 'm-place', 'text-anchor': pl.anchor || 'start' }, g, pl.name);
      });
      // Past and forecast track
      if (d.map.past && d.map.past.length > 1) {
        sv('path', { d: 'M' + d.map.past.map(function (q) { return P(q[0], q[1]).map(function (n) { return n.toFixed(1); }).join(','); }).join('L'), 'class': 'm-past' }, g);
      }
      sv('path', { d: 'M' + T.map(function (q) { return P(q.lat, q.lon).map(function (n) { return n.toFixed(1); }).join(','); }).join('L'), 'class': 'm-track' }, g);
      if (opts.local) {
        var lf = d.map.landfall, cd = d.map.condo;
        if (lf && d.map.hurricane_wind_mi) {
          var lp = P(lf.lat, lf.lon), rr = d.map.hurricane_wind_mi / 69.05 * v.S;
          sv('circle', { cx: lp[0], cy: lp[1], r: rr, 'class': 'm-wind' }, g);
          sv('text', { x: lp[0], y: lp[1] + rr + 18, 'class': 'm-wind-label', 'text-anchor': 'middle' }, g, 'Hurricane-force winds (est.)');
        }
        if (lf && cd) {
          var a1 = P(cd.lat, cd.lon), b1 = P(lf.lat, lf.lon);
          sv('line', { x1: a1[0], y1: a1[1], x2: b1[0], y2: b1[1], 'class': 'm-dist' }, g);
        }
        if (lf) {
          var lp2 = P(lf.lat, lf.lon);
          sv('circle', { cx: lp2[0], cy: lp2[1], r: 7, 'class': 'm-landfall' }, g);
          sv('text', { x: lp2[0] + 10, y: lp2[1] + 26, 'class': 'm-wind-label' }, g, lf.label);
        }
      }
      // Forecast points with NHC intensity letters
      T.forEach(function (q, idx) {
        var p = P(q.lat, q.lon);
        if (p[0] < -20 || p[0] > v.W + 20 || p[1] < -20 || p[1] > v.H + 20) return;
        var pt = sv('g', { 'class': 'm-pt' }, g);
        sv('circle', { cx: p[0], cy: p[1], r: 10 }, pt);
        sv('text', { x: p[0], y: p[1] }, pt, q.type);
        if (!opts.local || idx > 0) {
          var first = idx === 0;
          sv('text', { x: p[0] + (first ? -15 : 15), y: p[1] + 5, 'class': 'm-when', 'text-anchor': first ? 'end' : 'start' }, g, q.when + (q.mph ? ' · ' + q.mph + ' mph' : ''));
        }
      });
      // Condo
      if (d.map.condo) {
        var cp2 = P(d.map.condo.lat, d.map.condo.lon), cg = sv('g', { 'class': 'm-condo' }, g);
        sv('circle', { cx: cp2[0], cy: cp2[1], r: opts.local ? 8 : 6 }, cg);
        sv('text', { x: cp2[0] - 12, y: cp2[1] + (opts.local ? -12 : -10), 'text-anchor': 'end' }, cg, 'Our condo');
      }
      return svg;
    };
    var ms = section('Forecast path and cone', d.map.caption);
    var wrapMaps = el('div', 'maps');
    [['gulf', 'Gulf of Mexico forecast cone and path for ' + d.storm, false, d.map.gulf_caption],
     ['local', 'Close-up of the forecast landfall area near Orange Beach', true, d.map.local_caption]].forEach(function (m) {
      if (!base[m[0]]) return;
      var fig = el('figure');
      fig.appendChild(drawMap(base[m[0]], { id: m[0], aria: m[1], local: m[2] }));
      var cap = el('figcaption');
      cap.textContent = m[3] || '';
      fig.appendChild(cap);
      wrapMaps.appendChild(fig);
    });
    ms.appendChild(wrapMaps);
    var lg = el('div', 'legend');
    [['M', 'major hurricane, 111+ mph'], ['H', 'hurricane, 74–110 mph'], ['S', 'tropical storm, 39–73 mph'], ['D', 'depression'], ['L', 'post-tropical low']].forEach(function (x) {
      var s = el('span'); s.appendChild(el('b', null, x[0])); s.appendChild(document.createTextNode(' ' + x[1])); lg.appendChild(s);
    });
    ms.appendChild(lg);
    if (d.map.official_url) {
      var op = el('p', 'lede');
      op.appendChild(document.createTextNode('The shaded cone shows where the center will probably travel (about 2 out of 3 times). Damaging wind, surge and rain often reach well outside it. '));
      var oa = el('a', null, 'See the official NHC cone graphic');
      oa.href = d.map.official_url; oa.target = '_blank'; oa.rel = 'noopener';
      op.appendChild(oa);
      op.appendChild(document.createTextNode('.'));
      ms.appendChild(op);
    }
  }

  // Distance bars
  if (d.distance && d.distance.rows && d.distance.rows.length) {
    var ds = section('Distance from the condo', d.distance.caption);
    var max = Math.max.apply(null, d.distance.rows.map(function (r) { return r.miles; }));
    var bars = el('div', 'bars');
    d.distance.rows.forEach(function (r) {
      var row = el('div', 'bar-row' + (r.key ? ' key' : ''));
      row.appendChild(el('span', 't', r.when));
      var tr = el('div', 'track');
      var f = el('span', 'fill');
      f.style.width = 'calc((100% - 6.5em) * ' + (r.miles / max).toFixed(4) + ')';
      tr.appendChild(f);
      tr.appendChild(el('span', 'val', r.miles + ' mi ' + (r.dir || '')));
      row.appendChild(tr);
      bars.appendChild(row);
    });
    ds.appendChild(bars);
  }

  // At a glance
  var fs = section('At a glance');
  var dl = el('dl', 'facts');
  (d.facts || []).forEach(function (f) {
    var w = el('div', 'fact' + (f.tone ? ' ' + f.tone : ''));
    w.appendChild(el('dt', null, f.label));
    w.appendChild(el('dd', null, f.value));
    dl.appendChild(w);
  });
  fs.appendChild(dl);

  // Timeline
  var ts = section('What to expect', 'Forecast times are Central (condo time). Eastern is one hour later.');
  var ol = el('ol', 'timeline');
  (d.timeline || []).forEach(function (t) {
    var li = el('li', t.key ? 'key' : '');
    li.appendChild(el('span', 'when', t.when));
    li.appendChild(el('span', null, t.what));
    ol.appendChild(li);
  });
  ts.appendChild(ol);

  // Condo
  var cs = section('What it means for our condo');
  var note = el('div', 'note');
  var ul = el('ul', 'plain');
  (d.condo || []).forEach(function (c) { ul.appendChild(el('li', null, c)); });
  note.appendChild(ul);
  cs.appendChild(note);

  // Changes
  var ch = section('What changed since the last update');
  var cl = el('ul', 'plain');
  (d.changes || []).forEach(function (c) { cl.appendChild(el('li', null, c)); });
  ch.appendChild(cl);

  // History
  var hs = section('Storm history');
  var hl = el('dl', 'history');
  (d.history || []).forEach(function (h) {
    var w = el('div');
    w.appendChild(el('dt', null, h.when));
    w.appendChild(el('dd', null, h.what));
    hl.appendChild(w);
  });
  hs.appendChild(hl);

  // Footer
  var ft = el('footer');
  ft.appendChild(el('p', null, 'This page is a summary Claude puts together for our family about every 6 hours. It is not an official forecast. For decisions, follow the National Hurricane Center and Baldwin County / City of Orange Beach officials.'));
  var sl = el('ul', 'sources');
  (d.sources || []).forEach(function (s) {
    var li = el('li');
    var a = el('a', null, s.title);
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    li.appendChild(a);
    sl.appendChild(li);
  });
  ft.appendChild(sl);
  // Visitor counter. Runs only on the public GitHub copy (github.io); the Claude page blocks outside requests.
  // Each browser is counted once (remembered in localStorage); later visits only read the total.
  // Uses the free Abacus counting service; the counter name comes from the storm name.
  var vp = el('p', 'visits'); vp.hidden = true; ft.appendChild(vp);
  if (/(^|\.)github\.io$/.test(location.hostname) && window.fetch) {
    var vkey = 'storm-' + String(d.storm || 'page').toLowerCase().replace(/[^a-z0-9]+/g, '-');
    var vflag = 'romar-visited-' + vkey, seen = false;
    try { seen = localStorage.getItem(vflag) === '1'; } catch (e) {}
    fetch('https://abacus.jasoncameron.dev/' + (seen ? 'get' : 'hit') + '/tlittletony-romar/' + vkey)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || typeof j.value !== 'number') return;
        try { localStorage.setItem(vflag, '1'); } catch (e) {}
        vp.textContent = 'Visitors to this page: ' + j.value.toLocaleString('en-US');
        vp.hidden = false;
      })
      .catch(function () {});
  }
  app.appendChild(ft);
})();
